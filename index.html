 "أرز": "🍚", "مكرونة": "🍝", "جبن": "🧀", "تونة": "🐟", "جزر": "🥕", "فلفل": "🫑", "عدس": "🫘", "حمص": "🫘", "حليب": "🥛", "كوسة": "🥒", "زيتون": "🫒", "لحم": "🥩"},C=["الكل","سريعة","رئيسية","شوربات","سلطات","فطور","حلويات"];let selected=new Set(),cat="الكل",query="";
const $=x=>document.getElementById(x),fav=()=>JSON.parse(localStorage.getItem("fav")||"[]"),isfav=id=>fav().includes(id);
function savefav(id){let a=fav();a=a.includes(id)?a.filter(x=>x!==id):[...a,id];localStorage.setItem("fav",JSON.stringify(a));}
function card(r){return `<article class="card"><div class="photo"><img src="${r.image}" loading="lazy" alt="${r.name}"><button class="heart ${isfav(r.id)?"onheart":""}" onclick="savefav(${r.id});${locationPage()}">${isfav(r.id)?"♥":"♡"}</button></div><div class="body"><h3>${r.name}</h3><p>وصفة لذيذة بمكونات منزلية وخطوات واضحة.</p><div class="meta"><span class="pill">⏱ ${r.time} د</span><span class="pill">⭐ ${r.difficulty}</span><span class="pill">👥 ${r.servings}</span></div><button class="view" onclick="detail(${r.id})">شاهدي الوصفة كاملة ←</button></div></article>`}
function locationPage(){return "setTimeout(()=>location.reload(),0)"}
function cats(){return C.map(x=>`<button class="cat ${x==cat?"on":""}" onclick="cat='${x}';recipesPage()">${x}</button>`).join("")}
function home(){cat="الكل";query="";$("app").innerHTML=`<section class="wrap hero"><div class="heroGrid"><div><span class="ey">🍲 مساعدتك اليومية في المطبخ</span><h1>محتارة ماذا تطبخين؟<br><span>خلّي طبختي اليوم تقترح عليكِ!</span></h1><p>اختاري المكونات الموجودة عندك في البيت، وسنبحث لكِ عن وصفات تناسبها فعلًا، مع المقادير والخطوات كاملة.</p><div class="actions"><button class="primary" onclick="ingredientsPage()">✨ اقترحي لي طبخة</button><button class="secondary" onclick="detail(R[Math.floor(Math.random()*R.length)].id)">🎲 فاجئيني بطبخة!</button></div></div><div class="heroCard"><img src="${R[2].image}" alt="طبق شهي"></div></div></section><section class="wrap section"><div class="head"><div><h2>اختاري حسب مزاجك 🍽️</h2><p>وصلّي للوصفة التي تريدينها بسرعة.</p></div></div><div class="cats">${cats()}</div></section><section class="wrap section"><div class="head"><div><h2>وصفات نحبها اليوم ❤️</h2><p>أطباق منزلية متنوعة.</p></div><button class="secondary" onclick="recipesPage()">عرض الكل</button></div><div class="grid">${R.slice(0,8).map(card).join("")}</div></section>`}
function recipesPage(){let a=R.filter(r=>(cat=="الكل"||r.category==cat)&&(!query||r.name.includes(query)||r.ingredients.some(x=>x.includes(query))));$("app").innerHTML=`<section class="wrap section"><div class="head"><div><h2>كل الوصفات 🍽️</h2><p>ابحثي واختاري التصنيف.</p></div><div class="search"><input id="q" value="${query}" placeholder="ابحثي عن طبخة أو مكوّن"><button onclick="query=$('q').value;recipesPage()">🔎</button></div></div><div class="cats">${cats()}</div><div class="grid">${a.map(card).join("")||'<div class="empty" style="grid-column:1/-1">لا توجد نتائج.</div>'}</div></section>`}
function ingredientsPage(){let all=[...new Set(R.flatMap(r=>r.ingredients))];$("app").innerHTML=`<section class="wrap section"><div class="head"><div><h2>ماذا يوجد عندك في البيت؟ 🧺</h2><p>اختاري أي عدد من المكونات.</p></div></div><div class="panel"><div class="ings">${all.map(x=>`<button class="ing ${selected.has(x)?"sel":""}" onclick="selected.has('${x}')?selected.delete('${x}'):selected.add('${x}');ingredientsPage()"><span>${E[x]||"🍴"}</span>${x}</button>`).join("")}</div><div class="bar"><b>${selected.size} مكونات مختارة</b><button onclick="match()">🍳 اقترحي لي طبخة</button></div></div></section>`}
function match(){if(!selected.size)return alert("اختاري مكوّنًا واحدًا على الأقل ❤️");let a=R.map(r=>{let hits=[...selected].filter(x=>r.ingredients.includes(x)).length;return {...r,hits,missing:[...selected].filter(x=>!r.ingredients.includes(x))}}).filter(r=>r.hits).sort((a,b)=>b.hits-a.hits);$("app").innerHTML=`<section class="wrap section"><button class="back" onclick="ingredientsPage()">← تعديل المكونات</button><div class="head"><div><h2>الوصفات المناسبة لكِ ✨</h2><p>${[...selected].join(" + ")}</p></div></div><div class="note">تظهر أولًا الوصفات التي تحتوي على أكبر عدد من المكونات التي اخترتها، وتظهر المكونات الناقصة أسفل البطاقة عند الحاجة.</div><div class="grid">${a.map(r=>card(r)+`<small style="grid-column:1/-1;color:#8a5a3b;margin-top:-10px">${r.missing.length?"المكونات المختارة الناقصة: "+r.missing.join("، "):"✓ تحتوي على كل المكونات المختارة"}</small>`).join("")}</div></section>`}
function detail(id){let r=R.find(x=>x.id==id);$("app").innerHTML=`<section class="wrap section"><button class="back" onclick="recipesPage()">← العودة للوصفات</button><div class="detail"><img class="detailimg" src="${r.image}" alt="${r.name}"><div><h1>${r.name}</h1><p class="desc">وصفة منزلية شهية بمقادير دقيقة وخطوات سهلة.</p><div class="info"><span class="ibox">⏱ ${r.time} دقيقة</span><span class="ibox">⭐ ${r.difficulty}</span><span class="ibox">👥 ${r.servings}</span><button class="ibox" onclick="savefav(${r.id});detail(${r.id})">${isfav(r.id)?"♥ في المفضلة":"♡ أضيفي للمفضلة"}</button></div><div class="box"><h3>🧺 المقادير</h3><ul>${r.quantities.map(x=>`<li>${x}</li>`).join("")}</ul></div><div class="box"><h3>👩🏻‍🍳 طريقة التحضير</h3><ol>${r.steps.map(x=>`<li>${x}</li>`).join("")}</ol></div><div class="box"><h3>💡 نصيحة</h3><p>${r.tip}</p></div></div></div></section>`}
function favPage(){let a=R.filter(r=>fav().includes(r.id));$("app").innerHTML=`<section class="wrap section"><div class="head"><div><h2>وصفاتي المفضلة ❤️</h2><p>محفوظة على جهازك.</p></div></div><div class="grid">${a.map(card).join("")||'<div class="empty" style="grid-column:1/-1"><h3>لا توجد وصفات محفوظة بعد</h3><p>اضغطي ♡ على أي وصفة.</p></div>'}</div></section>`}
home();
</script></body></html>
